<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container text-center">
        <div class="row align-items-start">
             <div class="col-3">
                <form id="albumForm">
                    <div class="mb-3">
                        <label for="albumTitle" class="form-label">Album Title</label>
                        <input name="title" type="text" class="form-control" id="albumTitle">
                    </div>
                    <div class="mb-3">
                        <label for="albumArtist" class="form-label">Artist</label>
                        <input name="artist" type="text" class="form-control" id="albumArtist">
                    </div>
                    <div class="mb-3">
                        <label for="albumYear" class="form-label">Release Year</label>
                        <input name="year" type="number" class="form-control" id="albumYear">
                    </div>
                    <div class="mb-3">
                        <label for="albumGenre" class="form-label">Genre</label>
                        <input name="genre" type="text" class="form-control" id="albumGenre">
                    </div>
                    <div class="mb-3">
                        <label for="albumRating" class="form-label">Rating</label>
                        <input name="rating" type="number" class="form-control" id="albumRating" placeholder="/10">
                    </div>
                    <div class="mb-3 form-check">
                        <input name="listened" type="checkbox" class="form-check-input" id="albumListened">
                        <label class="form-check-label" for="albumListened">I have listened to this album</label>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                </form>
            </div>
            <div id="albumContainer" class="col-9">
                Espacio para generar los albumes.
                <p>Texto dentro de un p</p>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
